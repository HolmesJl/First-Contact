<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Contact · Ship exterior (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      canvas { display: block; }
      .title { position: fixed; top: 12px; left: 16px; color: #5ee7ff; font: 700 13px Inter, system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 1px 3px #000; }
      .title small { display: block; margin-top: 4px; color: #8fa3c4; font-weight: 500; letter-spacing: .04em; text-transform: none; }
      .bar { position: fixed; display: flex; gap: 6px; flex-wrap: wrap; }
      .bar.views { bottom: 16px; left: 50%; transform: translateX(-50%); }
      .bar.toggles { top: 12px; right: 16px; }
      button { font: 600 12px Inter, system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #cfe3ff; background: rgba(14, 22, 38, .82); border: 1px solid #2a3a58; border-radius: 6px; padding: 8px 14px; cursor: pointer; backdrop-filter: blur(6px); }
      button:hover { border-color: #5ee7ff; color: #fff; }
      button.on, button.active { background: #134a5c; border-color: #5ee7ff; color: #fff; }
      .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .labels div { position: absolute; color: #eaf4ff; font: 600 11px Inter, system-ui, sans-serif; letter-spacing: .05em; padding: 1px 5px; background: rgba(8, 14, 26, .7); border-radius: 3px; transform: translate(-50%, -50%); white-space: nowrap; }
      body.clean .ui { display: none; }
    </style>
  </head>
  <body>
    <div class="labels" id="labels"></div>
    <div class="ui">
      <div class="title">
        Ship exterior · greybox
        <small id="viewName"></small>
      </div>
      <div class="bar toggles">
        <button id="spin">Turntable</button>
        <button id="labelsBtn">Labels</button>
        <button id="docksBtn">Docks</button>
      </div>
      <div class="bar views" id="views"></div>
    </div>
    <script type="module" src="/src/exterior.ts"></script>
  </body>
</html>
