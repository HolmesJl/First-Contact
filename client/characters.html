<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First Contact · Character pipeline spike (dev)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      canvas { display: block; }
      .title { position: fixed; top: 12px; left: 16px; color: #5ee7ff; font: 700 13px Inter, system-ui, sans-serif; letter-spacing: .2em; text-transform: uppercase; text-shadow: 0 1px 3px #000; pointer-events: none; }
      .title small { display: block; margin-top: 4px; color: #8fa3c4; font-weight: 500; letter-spacing: .04em; text-transform: none; }
      .panel { position: fixed; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: rgba(8, 14, 26, .72); border: 1px solid #1d2a44; border-radius: 8px; padding: 6px 8px; backdrop-filter: blur(6px); }
      .panel.top { top: 12px; right: 16px; max-width: 70vw; justify-content: flex-end; }
      .panel.bottom { bottom: 14px; left: 50%; transform: translateX(-50%); }
      .panel .group { display: flex; gap: 4px; align-items: center; padding: 0 6px; border-right: 1px solid #1d2a44; }
      .panel .group:last-child { border-right: 0; }
      .panel .group > span { color: #7f94b8; font: 600 10px Inter, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; margin-right: 2px; }
      button { font: 600 12px Inter, system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: #cfe3ff; background: rgba(14, 22, 38, .9); border: 1px solid #2a3a58; border-radius: 6px; padding: 7px 11px; cursor: pointer; }
      button:hover { border-color: #5ee7ff; color: #fff; }
      button.on { background: #134a5c; border-color: #5ee7ff; color: #fff; }
      input[type="color"] { width: 32px; height: 28px; padding: 0; border: 1px solid #2a3a58; background: none; border-radius: 6px; cursor: pointer; }
      .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .labels div { position: absolute; transform: translate(-50%, 0); text-align: center; color: #eaf4ff; font: 600 12px Inter, system-ui, sans-serif; letter-spacing: .04em; white-space: nowrap; text-shadow: 0 1px 3px #000; }
      .labels div small { display: block; margin-top: 2px; font-weight: 500; font-size: 11px; color: #9fb4d6; letter-spacing: .02em; }
      .labels div.old { color: #ffcf8a; }
      .labels div.new { color: #7ff0c8; }
      .banner { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); color: #8fa3c4; font: 500 12px Inter, system-ui, sans-serif; pointer-events: none; text-shadow: 0 1px 3px #000; }
      body.clean .panel, body.clean .banner { display: none; }
      #caption { position: fixed; top: 58px; left: 50%; transform: translateX(-50%); color: #eaf4ff; font: 700 22px Inter, system-ui, sans-serif; letter-spacing: .18em; text-transform: uppercase; text-shadow: 0 2px 6px #000; pointer-events: none; display: none; }
      #caption small { display: block; text-align: center; margin-top: 4px; font: 500 13px Inter, system-ui, sans-serif; letter-spacing: .04em; text-transform: none; color: #9fb4d6; }
      #status { position: fixed; left: 16px; top: 52px; color: #8fa3c4; font: 500 12px Inter, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div class="title">
      Character pipeline spike
      <small>Quaternius (current) vs MPFB + ACCAD mocap · dev only</small>
    </div>
    <div class="labels" id="labels"></div>
    <div class="banner">Drag to orbit · wheel to zoom · right-drag to pan</div>
    <div class="panel top" id="top"></div>
    <div class="panel bottom" id="bottom"></div>
    <div id="caption"></div>
    <div id="status">loading…</div>
    <script type="module" src="/src/characters.ts"></script>
  </body>
</html>
